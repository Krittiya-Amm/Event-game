<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5fb"/>
      <stop offset=".5" stop-color="#b9bdd3"/>
      <stop offset="1" stop-color="#e3e5f0"/>
    </linearGradient>
    <radialGradient id="heart" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffb3d1"/>
      <stop offset="1" stop-color="#ff5c9a"/>
    </radialGradient>
  </defs>
  <!-- ring -->
  <circle cx="40" cy="24" r="15" fill="none" stroke="#8d92ad" stroke-width="7.5"/>
  <circle cx="40" cy="24" r="15" fill="none" stroke="url(#metal)" stroke-width="4.5"/>
  <!-- chain -->
  <g fill="none" stroke="#8d92ad" stroke-width="3">
    <ellipse cx="49" cy="42" rx="3.4" ry="5" transform="rotate(-35 49 42)"/>
    <ellipse cx="55" cy="49" rx="3.4" ry="5" transform="rotate(55 55 49)"/>
    <ellipse cx="60" cy="55" rx="3.4" ry="5" transform="rotate(-25 60 55)"/>
  </g>
  <!-- heart charm -->
  <path d="M62 110 C30 92 20 72 30 58 C39 46 55 48 62 60 C69 48 85 46 94 58 C104 72 94 92 62 110 Z"
        fill="url(#heart)" stroke="#c2185b" stroke-width="2.8" stroke-linejoin="round"/>
  <ellipse cx="42" cy="64" rx="6" ry="3.5" fill="#fff" opacity=".6" transform="rotate(-30 42 64)"/>
  <!-- face -->
  <ellipse cx="52" cy="76" rx="3.8" ry="4.6" fill="#4a1630"/>
  <ellipse cx="72" cy="76" rx="3.8" ry="4.6" fill="#4a1630"/>
  <circle cx="53.4" cy="74.2" r="1.5" fill="#fff"/>
  <circle cx="73.4" cy="74.2" r="1.5" fill="#fff"/>
  <ellipse cx="44" cy="85" rx="5.5" ry="3.2" fill="#ff2f7a" opacity=".45"/>
  <ellipse cx="80" cy="85" rx="5.5" ry="3.2" fill="#ff2f7a" opacity=".45"/>
  <path d="M57 83 Q62 89 67 83" fill="#7a1f45" stroke="#4a1630" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sparkles -->
  <path d="M98 30 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z" fill="#ffd34d"/>
  <circle cx="86" cy="18" r="2.5" fill="#ffd34d"/>
</svg>
