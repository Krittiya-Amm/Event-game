<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5cf0"/>
      <stop offset="1" stop-color="#2b1e86"/>
    </linearGradient>
    <radialGradient id="moonfill" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="1" stop-color="#ffc93c"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="120" height="120" fill="#fff"/>
      <circle cx="76" cy="46" r="22" fill="#000"/>
    </mask>
  </defs>
  <!-- card -->
  <g transform="rotate(-6 60 60)">
    <rect x="24" y="10" width="72" height="100" rx="12" fill="url(#sky)" stroke="#20165f" stroke-width="2.5"/>
    <rect x="30" y="16" width="60" height="88" rx="8" fill="none" stroke="#ffd36b" stroke-width="2" stroke-dasharray="1 4.5" stroke-linecap="round"/>
    <!-- stars -->
    <path d="M80 82 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" fill="#fff"/>
    <path d="M38 24 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 Z" fill="#ffe28a"/>
    <circle cx="82" cy="26" r="1.8" fill="#fff"/>
    <circle cx="40" cy="92" r="1.8" fill="#ffe28a"/>
    <circle cx="66" cy="96" r="1.4" fill="#fff" opacity=".8"/>
    <!-- moon -->
    <circle cx="60" cy="56" r="26" fill="url(#moonfill)" stroke="#e0a106" stroke-width="2.5" mask="url(#crescent)"/>
    <!-- sleepy face -->
    <path d="M42 54 Q45.5 57.5 49 54" fill="none" stroke="#5a3b00" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="44" cy="63" rx="4.5" ry="2.8" fill="#ff8a7a" opacity=".6"/>
    <path d="M47 67 Q50 70 53 67" fill="none" stroke="#5a3b00" stroke-width="2.2" stroke-linecap="round"/>
    <!-- zzz -->
    <text x="70" y="78" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="700" font-size="10" fill="#ffe28a">z</text>
    <text x="76" y="71" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="700" font-size="7" fill="#ffe28a" opacity=".8">z</text>
  </g>
</svg>
