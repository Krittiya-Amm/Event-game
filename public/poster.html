<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR ป้ายหน้าบูธ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1f1640; --brand: #5b2be0; --accent: #ffc531; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Prompt', sans-serif; color: var(--ink); background: #e9e6f5; }
    .toolbar { display: flex; justify-content: center; gap: 10px; padding: 14px; }
    .toolbar button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px; background: var(--brand); color: #fff; cursor: pointer; }
    .poster {
      width: min(210mm, 100% - 32px); aspect-ratio: 210 / 297; margin: 0 auto 32px; padding: 7% 8%;
      background: linear-gradient(160deg, #2a1180, #5b2be0 60%, #c026d3 130%); color: #fff; border-radius: 18px;
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3.2%;
    }
    .eyebrow { font-weight: 600; letter-spacing: 3px; font-size: clamp(11px, 2.2vw, 18px); opacity: .85; }
    h1 { margin: 0; font-weight: 800; font-size: clamp(34px, 9vw, 76px); line-height: 1.05; }
    h1 span { display: block; color: var(--accent); }
    .prizes { display: flex; gap: 4%; justify-content: center; width: 100%; }
    .prizes img { width: 22%; max-width: 120px; background: #fff; border-radius: 18%; padding: 2%; }
    .qr { background: #fff; padding: 3%; border-radius: 22px; width: 52%; box-shadow: 0 20px 40px -15px rgba(0, 0, 0, .5); }
    .qr img { display: block; width: 100%; }
    .scan { font-size: clamp(16px, 3.6vw, 30px); font-weight: 800; }
    ol { list-style: none; padding: 0; margin: 0; display: flex; gap: 3%; width: 100%; justify-content: center; font-size: clamp(11px, 2.1vw, 17px); }
    ol li { flex: 1; background: rgba(255, 255, 255, .14); border-radius: 14px; padding: 3% 2%; }
    ol b { display: block; font-size: 1.5em; color: var(--accent); }
    .foot { margin-top: auto; font-size: clamp(10px, 1.8vw, 14px); opacity: .8; }
    @media print {
      @page { size: A4; margin: 0; }
      body { background: none; }
      .toolbar { display: none; }
      .poster { width: 210mm; height: 297mm; margin: 0; border-radius: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="toolbar"><button type="button" onclick="print()">🖨 พิมพ์ป้าย (A4)</button></div>
  <main class="poster">
    <div class="eyebrow" id="event">SCRATCH &amp; WIN</div>
    <h1>ขูดบัตร<span>ลุ้นรางวัล!</span></h1>
    <div class="prizes">
      <img src="/img/prizes/doll.png" alt="ตุ๊กตาน้องสุกี้">
      <img src="/img/prizes/keychain.svg" alt="พวงกุญแจ">
      <img src="/img/prizes/card.svg" alt="การ์ดมูน">
    </div>
    <div class="qr"><img src="/api/qr-entry" alt="QR เข้าเกม"></div>
    <div class="scan">📱 สแกนเพื่อเล่นเลย</div>
    <ol>
      <li><b>1</b>สแกน QR</li>
      <li><b>2</b>กรอกข้อมูล</li>
      <li><b>3</b>ขูดบัตร</li>
      <li><b>4</b>รับรางวัลที่บูธ</li>
    </ol>
    <div class="foot">รางวัลมีจำนวนจำกัด 50 ท่านแรกต่อวัน · เล่นได้ 1 ครั้ง / 1 เบอร์โทร</div>
  </main>
  <script type="module">
    fetch('/api/config').then((r) => r.json()).then((c) => {
      if (c.eventName) document.getElementById('event').textContent = c.eventName.toUpperCase();
    }).catch(() => {});
  </script>
</body>
</html>
