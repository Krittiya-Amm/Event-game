<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>QR ป้ายหน้าบูธ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Same palette as the game (Wizemoves / Sellsuki brand colours). */
    :root {
      --violet: #7c3aed; --violet-deep: #5b21b6; --lavender: #f5f3ff; --lavender-2: #ede9fe;
      --yellow: #fcd34d; --yellow-2: #facc15; --yellow-deep: #d99a06; --sky: #32a9ff; --orange: #f36f25; --pink: #f472b6;
      --navy: #090f27; --ink: #1e1b3a; --ink-soft: #5f5a7a;
      --brand-grad: linear-gradient(100deg, var(--violet) 0%, #a855f7 45%, var(--orange) 100%);
      --sunny: linear-gradient(180deg, #fde68a 0%, var(--yellow) 45%, var(--yellow-2) 100%);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Prompt', system-ui, sans-serif; color: var(--ink); background: #e9e5f7; }
    .toolbar { display: flex; justify-content: center; padding: 14px; }
    .toolbar button {
      font: inherit; font-weight: 600; font-size: 15px; border: 0; border-radius: 14px; padding: 12px 22px; min-height: 48px; cursor: pointer;
      color: var(--navy); background: var(--sunny); box-shadow: 0 4px 0 var(--yellow-deep);
    }
    .toolbar button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--yellow-deep); }

    .poster {
      position: relative; overflow: hidden; isolation: isolate;
      width: min(210mm, 100% - 32px); aspect-ratio: 210 / 297; margin: 0 auto 32px; padding: 5% 8% 4.5%;
      border-radius: 18px; color: var(--ink); text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 2%;
      background:
        radial-gradient(42% 30% at 6% 4%, rgba(139, 92, 246, .3) 0%, transparent 70%),
        radial-gradient(38% 26% at 98% 10%, rgba(252, 211, 77, .45) 0%, transparent 70%),
        radial-gradient(45% 30% at 100% 80%, rgba(50, 169, 255, .2) 0%, transparent 70%),
        radial-gradient(40% 28% at 0% 98%, rgba(243, 111, 37, .16) 0%, transparent 70%),
        linear-gradient(180deg, #f3eeff 0%, #faf8ff 55%, #f5f3ff 100%);
      box-shadow: 0 30px 60px -30px rgba(91, 33, 182, .45);
      container-type: inline-size; /* sizes below scale with the poster width (cqw) */
    }
    .logo { width: 24cqw; height: auto; }
    .eyebrow { font-weight: 600; letter-spacing: .16em; text-transform: uppercase; font-size: 2.1cqw; color: var(--violet); }
    h1 { margin: 0; font-weight: 600; line-height: 1.2; font-size: 9cqw; color: var(--navy); }
    h1 span { display: block; background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .05em; }
    .lede { margin: -1% 0 0; font-size: 2.5cqw; color: var(--ink-soft); }

    .prizes { display: flex; justify-content: center; gap: 5cqw; width: 100%; }
    .prize { display: grid; justify-items: center; gap: 1cqw; width: 19cqw; }
    .prize .art {
      --tc: var(--sky);
      width: 17cqw; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: #fff;
      box-shadow: 0 0 0 1cqw color-mix(in srgb, var(--tc) 35%, #fff), 0 2cqw 4cqw -2cqw rgba(91, 33, 182, .5);
    }
    .prize.special .art { --tc: var(--pink); }
    .prize.grand .art { --tc: var(--yellow-2); }
    .prize img { width: 74%; height: 74%; object-fit: contain; }
    .prize .n { font-weight: 600; font-size: 2.3cqw; line-height: 1.3; margin-top: 1cqw; }
    .prize .t { font-weight: 600; font-size: 1.7cqw; padding: .2cqw 1.6cqw; border-radius: 99px; background: color-mix(in srgb, var(--sky) 22%, #fff); }
    .prize.special .t { background: color-mix(in srgb, var(--pink) 22%, #fff); }
    .prize.grand .t { background: color-mix(in srgb, var(--yellow-2) 30%, #fff); }

    .qr-card {
      display: grid; justify-items: center; gap: 1.6cqw; width: 44cqw; padding: 3cqw 3cqw 2.4cqw; border-radius: 4cqw; background: #fff;
      box-shadow: 0 0 0 .8cqw var(--lavender-2), 0 3cqw 6cqw -3cqw rgba(91, 33, 182, .55);
    }
    .qr-card img { display: block; width: 100%; aspect-ratio: 1; }
    .scan {
      width: 100%; padding: 1.8cqw 2cqw; border-radius: 2.6cqw; font-weight: 600; font-size: 3.2cqw; color: var(--navy);
      background: var(--sunny); box-shadow: 0 .8cqw 0 var(--yellow-deep);
    }

    ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2cqw; width: 100%; counter-reset: s; }
    ol li {
      counter-increment: s; display: grid; justify-items: center; gap: 1cqw; padding: 2.2cqw 1cqw; border-radius: 3cqw;
      background: rgba(255, 255, 255, .8); font-size: 2.1cqw; font-weight: 500; line-height: 1.3;
    }
    ol li::before {
      content: counter(s); width: 5.2cqw; height: 5.2cqw; border-radius: 50%; display: grid; place-items: center;
      font-weight: 600; font-size: 2.6cqw; background: var(--violet); color: #fff;
    }
    .foot { margin-top: auto; font-size: 1.8cqw; color: var(--ink-soft); }

    @media print {
      @page { size: A4; margin: 0; }
      body { background: none; }
      .toolbar { display: none; }
      .poster { width: 210mm; height: 297mm; margin: 0; border-radius: 0; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="toolbar"><button type="button" onclick="print()">พิมพ์ป้าย (A4)</button></div>
  <main class="poster">
    <img class="logo" src="/img/sellsuki-logo.svg" alt="Sellsuki">
    <div class="eyebrow" id="event">Sellsuki Scratch &amp; Win</div>
    <h1>ขูดบัตร<span>ลุ้นรางวัลพิเศษ</span></h1>
    <p class="lede">ขูดบัตรลุ้นของรางวัลจากบูธ Sellsuki และรับโปรโมชันพิเศษกลับไปทุกคน</p>
    <div class="prizes" id="prizes"></div>
    <div class="qr-card">
      <img src="/api/qr-entry" alt="QR เข้าเกม">
      <div class="scan">สแกนเพื่อเล่นเลย</div>
    </div>
    <ol>
      <li>สแกน QR</li>
      <li>ลงทะเบียน</li>
      <li>เลือกการ์ด แล้วขูด</li>
      <li>รับรางวัลที่บูธ</li>
    </ol>
    <div class="foot" id="foot">รางวัลมีจำนวนจำกัดในแต่ละวัน · 1 สิทธิ์ / 1 เบอร์โทร · ทุกคนได้รับโปรโมชัน</div>
  </main>
  <script type="module">
    // Same prizes, artwork and tier labels as the game.
    const ART_SRC = { doll: '/img/prizes/doll.png', keychain: '/img/prizes/keychain.svg', card: '/img/prizes/card.svg' };
    const TIER_OF = { doll: 'grand', keychain: 'special', card: 'standard' };
    const TIER_LABEL = { grand: 'รางวัลใหญ่', special: 'รางวัลพิเศษ', standard: 'รางวัลนำโชค' };
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const render = (prizes) => {
      document.getElementById('prizes').innerHTML = prizes.slice(0, 4).map((p) => {
        const t = TIER_OF[p.id] || 'standard';
        const src = p.image || ART_SRC[p.id];
        return `<div class="prize ${t}"><span class="art">${src ? `<img src="${esc(src)}" alt="">` : ''}</span>`
          + `<span class="n">${esc(p.name)}</span><span class="t">${TIER_LABEL[t]}</span></div>`;
      }).join('');
    };
    render([{ id: 'doll', name: 'ตุ๊กตาน้องสุกี้' }, { id: 'keychain', name: 'พวงกุญแจ' }, { id: 'card', name: 'การ์ดมูน' }]);
    fetch('/api/config').then((r) => r.json()).then((c) => {
      if (c.eventName) document.getElementById('event').textContent = c.eventName;
      if (c.prizes?.length) render(c.prizes);
      if (c.playLimit === 'day') document.getElementById('foot').textContent = 'รางวัลมีจำนวนจำกัดในแต่ละวัน · วันละ 1 สิทธิ์ / เบอร์โทร · ทุกคนได้รับโปรโมชัน';
    }).catch(() => {});
  </script>
</body>
</html>
